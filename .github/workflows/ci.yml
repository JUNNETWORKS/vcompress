name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go build ./cmd/vcompress

  vet-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg prerequisites
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -encoders 2>&1 | grep libx265
      - run: go test -tags=integration ./internal/processor -run TestIntegrationMPEG4ToHEVC -v
